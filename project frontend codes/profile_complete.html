<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل - فروشگاه لپ‌تاپ و کامپیوتر</title>

    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://lib.arvancloud.ir/font-awesome/6.3.0/css/all.min.css">

    <style>
        .profile-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .profile-card-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            color: white;
        }
        .form-label {
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #0b5ed7 0%, #0d6efd 100%);
        }
    </style>
</head>
<body>
<!-- تاپ بار و نوار ناوبری (همان کد قبلی) -->
<!-- (کد تاپ بار و نوار ناوبری از صفحه ورود را کپی کنید) -->

<!-- صفحه پروفایل -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card profile-card">
                    <div class="card-header profile-card-header text-center">
                        <h3 class="fw-bold">پروفایل کاربری</h3>
                    </div>
                    <div class="card-body p-5">
                        <form>
                            <div class="mb-4">
                                <label for="fullname" class="form-label">نام و نام خانوادگی</label>
                                <input type="text" class="form-control form-control-lg" id="fullname" value="علی احمدی" required>
                            </div>
                            <div class="mb-4">
                                <label for="email" class="form-label">ایمیل</label>
                                <input type="email" class="form-control form-control-lg" id="email" value="ali.ahmadi@example.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="phone" class="form-label">شماره تماس</label>
                                <input type="tel" class="form-control form-control-lg" id="phone" value="09123456789" required>
                            </div>
                            <div class="mb-4">
                                <label for="address" class="form-label">آدرس</label>
                                <textarea class="form-control form-control-lg" id="address" rows="3">تهران، خیابان شهید بهشتی، پلاک 123</textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">ذخیره تغییرات</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- فوتر (همان کد قبلی) -->
<!-- (کد فوتر از صفحه ورود را کپی کنید) -->

<script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://lib.arvancloud.ir/font-awesome/6.3.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
