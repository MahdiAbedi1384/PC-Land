{% extends "_base.html" %}

{% block page_title %}تغییر موفقیت‌آمیز | LaptopStore{% endblock page_title %}

{% block content %}
    <div class="container my-5" style="direction: rtl;">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-3 text-center">
                    <div class="card-body p-4 p-md-5">
                        <i class="fas fa-check-circle fa-4x text-success mb-4"></i>
                        <h3 class="fw-bold mb-3">رمز عبور تغییر کرد!</h3>
                        <p class="text-muted mb-4">
                            رمز عبور شما با موفقیت تغییر یافت. اکنون می‌توانید با رمز عبور جدید وارد حساب کاربری خود
                            شوید.
                        </p>
                        <a href="{% url 'login' %}" class="btn btn-primary px-5 py-2">
                            <i class="fas fa-sign-in-alt me-2"></i> ورود به حساب
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
